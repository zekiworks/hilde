# Golden assertions for "Attention Is All You Need" (arXiv 1706.03762 v7).
# Patterns are Python regexes. Kinds:
#   must_contain      pattern, or list of patterns that must all match
#   must_not_contain  pattern, or list of patterns where none may match
#   order             list of patterns whose first matches must appear in this order
# `manual` lists checks a human or reviewer agent does by ear or by eye.
paper: attention
asserts:
  - id: ATT-01
    bug: B10
    about: Footnote 4 is read right after "extremely small gradients", before the Multi-Head Attention heading
    order: ['extremely small gradients', 'why the dot products get large', '(?m)^(\d+(\.\d+)*\.?\s+)?Multi-Head Attention\s*$']

  - id: ATT-02
    bug: B10
    about: Footnote 5 (TFLOPS values) is read after "capacity of each GPU", before the Model Variations heading
    order: ['capacity of each GPU', '9\.5 (teraflops|trillion|TFLOPS)', '(?m)^(\d+(\.\d+)*\.?\s+)?Model Variations\s*$']

  - id: ATT-03
    bug: B18
    about: Gomez's affiliation note names him, in any word order ("Work performed while Aidan N. Gomez was at Google Brain" passes)
    must_contain: '(?i)(?:Gomez(?:[^.\n]|(?<=\b[A-Z])\.){0,60}\bwork\w*\b(?:[^.\n]|(?<=\b[A-Z])\.){0,40}Google Brain|\bwork\w*\b(?:[^.\n]|(?<=\b[A-Z])\.){0,40}Gomez(?:[^.\n]|(?<=\b[A-Z])\.){0,40}Google Brain)'

  - id: ATT-04
    bug: B18
    about: 'Polosukhin''s affiliation note names him, in any word order ("Illia Polosukhin: Work performed while at Google Research" passes)'
    must_contain: '(?i)(?:Polosukhin(?:[^.\n]|(?<=\b[A-Z])\.){0,60}\bwork\w*\b(?:[^.\n]|(?<=\b[A-Z])\.){0,40}Google Research|\bwork\w*\b(?:[^.\n]|(?<=\b[A-Z])\.){0,40}Polosukhin(?:[^.\n]|(?<=\b[A-Z])\.){0,40}Google Research)'

  - id: ATT-05
    bug: B18
    about: Author row 1 is paired with affiliations
    must_contain: ['Shazeer,? Google Brain', 'Uszkoreit,? Google Research']

  - id: ATT-06
    bug: B18
    about: Author row 2 is paired with affiliations
    must_contain: ['Llion Jones,? Google Research', 'Gomez,? University of Toronto', 'Kaiser,? Google Brain']

  - id: ATT-07
    bug: B13
    about: Contribution note keeps its first sentences
    must_contain: '(?i)equal contribution\. listing order is random'

  - id: ATT-08
    bug: null
    about: Source quirk kept (D07). Both BLEU values stay as printed
    must_contain: ['41\.0', '41\.8']

  - id: ATT-09
    bug: B24
    about: No softened scaling; the factor is one over the square root
    must_not_contain: '(?i)scal(ed|ing factor of) (by )?the square root'

  - id: ATT-10
    bug: B24
    about: Key and value sizes are not described as "one dimension"
    must_not_contain: '(?i)\bof one dimension\b'

  - id: ATT-11
    bug: B13
    about: Approved Table 3 description keeps parameters, perplexities and the per-wordpiece caveat
    must_contain: ['(?i)\b65 ?(million|M)\b|sixty-five million', '(?i)\b213 ?(million|M)\b|two hundred (and )?thirteen million', '4\.92', '4\.33', '(?i)per[- ]?word[- ]?piece']

  - id: ATT-12
    bug: B26
    about: '"Attention Visualizations" is read as a heading'
    must_contain: '(?m)^(\d+(\.\d+)*\.?\s+)?Attention Visualizations\s*$'

  - id: ATT-13
    bug: B13
    about: The code link says where the code is
    must_contain: '(?i)available (in|on|at) [^.\n]{0,40}(tensor2tensor|github)'

  - id: ATT-14
    bug: B26
    about: Footer spacing
    must_not_contain: 'byZeki'

  - id: ATT-15
    bug: B22
    about: Background roadmap sentence is dropped (D02)
    must_not_contain: '(?i)we will describe the Transformer'

  - id: ATT-16
    bug: B13
    about: Convolution paragraph keeps the layer counts
    must_contain: '(?i)\bn (divided by|over) k\b'

  - id: ATT-18
    bug: B21
    about: The paper's own voice ("we")
    must_not_contain: '(?i)\bthe authors\b'

  - id: ATT-20
    bug: B20
    about: d_k and d_v are spoken as two letters
    must_not_contain: '\b(dk|dv)\b'

  - id: ATT-21
    bug: B13
    about: Approved Figure 4 description keeps both words "its" attends to (checked against the image)
    must_contain: '(?i)\bits\b[^\n]{0,120}\blaw\b[^\n]{0,60}\bapplication\b'

  # Added 2026-10-03 from the 3 Oct review (Claude, Astra) and Can's two Mistral runs on 90b9e7f.
  - id: ATT-22
    bug: B19
    about: §3.4 credits weight sharing to Press and Wolf (ref. 30), not to the paper's own authors
    must_contain: '(?i)similar to [^.\n]{0,40}\bPress\b'
    must_not_contain: 'Vaswani (and (others|colleagues)|et al)'

  - id: ATT-23
    bug: B19
    about: Citation handling leaves no numbered brackets and no dangling "and." where a citation was removed
    must_not_contain: ['\[\d{1,3}(\s*[,–-]\s*\d{1,3})*\]', '\band\.(\s|$)']

  - id: ATT-24
    bug: B02
    about: Figure 1 keeps the decoder's masked self-attention apart from the (unmasked) attention over the encoder output
    must_not_contain: '(?i)\bmasked\b[^.,;\n]{0,40}\b(?:(?:that|which)\s+(?:attends?|looks?)|attending|looking)\b[^.,;\n]{0,20}\bencoder'

  - id: ATT-25
    bug: B02
    about: Table 3 rows (B) vary the key size d k, not d v
    must_not_contain: '(?i)\b(variation|rows?|group) \(?B\)?[^.\n]{0,60}\bd v\b'

  - id: ATT-26
    bug: B03
    about: >
      The multi-head and positional-encoding equations are unnumbered in the paper; their descriptions
      open with no Figure, Table or Equation number and carry no equation number anywhere. Each description
      is found twice, by the prose paragraph before it and by the one after, so a reworded anchor does not
      fail the check (Can, 952f393 run). On book folders G11 covers openings on every paper.
    must_not_contain:
      - '(?:averaging inhibits this|single attention head)[^\n]*\n\s*(?i:description\s+)?(?:(?:Figures?|Tables?)|(?:Equations?|Eq\.))\s+\(?(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b'
      - '(?:averaging inhibits this|single attention head)[^\n]*\n\s*(?i:description\s+)?[^\n]*\b(?:Equations?|Eq\.)\s+\(?(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b'
      - '(?m)^[^\n]*\b(?:Equations?|Eq\.)\s+\(?(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b[^\n]*\n\s*[^\n]*?(?:parameter matrices)'
      - '(?:different frequencies|sine and cosine functions)[^\n]*\n\s*(?i:description\s+)?(?:(?:Figures?|Tables?)|(?:Equations?|Eq\.))\s+\(?(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b'
      - '(?:different frequencies|sine and cosine functions)[^\n]*\n\s*(?i:description\s+)?[^\n]*\b(?:Equations?|Eq\.)\s+\(?(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b'
      - '(?m)^[^\n]*\b(?:Equations?|Eq\.)\s+\(?(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b[^\n]*\n\s*[^\n]*?(?:i is the dimension)'
  - id: ATT-27
    bug: B03
    about: >
      Equations 1, 2 (FFN) and 3 are named by their printed number: no description opens with "Figure N"
      or "Table N", and none names another equation number. Anchored before and after, as ATT-26.
    must_not_contain:
      - '(?:outputs as:|matrix of outputs)[^\n]*\n\s*(?i:description\s+)?(?:Figures?|Tables?)\s+\(?(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b'
      - '(?:outputs as:|matrix of outputs)[^\n]*\n\s*(?i:description\s+)?[^\n]*\b(?:Equations?|Eq\.)\s+\(?(?!1\b|one\b)(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b'
      - '(?m)^(?:Figures?|Tables?)\s+\(?(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b[^\n]*\n\s*[^\n]*?(?:most commonly used attention functions)'
      - '(?m)^[^\n]*\b(?:Equations?|Eq\.)\s+\(?(?!1\b|one\b)(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b[^\n]*\n\s*[^\n]*?(?:most commonly used attention functions)'
      - '(?:ReLU activation)[^\n]*\n\s*(?i:description\s+)?(?:Figures?|Tables?)\s+\(?(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b'
      - '(?:ReLU activation)[^\n]*\n\s*(?i:description\s+)?[^\n]*\b(?:Equations?|Eq\.)\s+\(?(?!2\b|two\b)(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b'
      - '(?m)^(?:Figures?|Tables?)\s+\(?(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b[^\n]*\n\s*[^\n]*?(?:same across different positions)'
      - '(?m)^[^\n]*\b(?:Equations?|Eq\.)\s+\(?(?!2\b|two\b)(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b[^\n]*\n\s*[^\n]*?(?:same across different positions)'
      - '(?:according to the formula|learning rate over the course of training)[^\n]*\n\s*(?i:description\s+)?(?:Figures?|Tables?)\s+\(?(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b'
      - '(?:according to the formula|learning rate over the course of training)[^\n]*\n\s*(?i:description\s+)?[^\n]*\b(?:Equations?|Eq\.)\s+\(?(?!3\b|three\b)(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b'
      - '(?m)^(?:Figures?|Tables?)\s+\(?(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b[^\n]*\n\s*[^\n]*?(?:increasing the learning rate linearly)'
      - '(?m)^[^\n]*\b(?:Equations?|Eq\.)\s+\(?(?!3\b|three\b)(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b[^\n]*\n\s*[^\n]*?(?:increasing the learning rate linearly)'
  - id: ATT-28
    bug: B20
    about: Footnote 4's sum runs from i equals 1, not "from d i"
    must_not_contain: '(?i)\bfrom d i\b'

  - id: ATT-29
    bug: B20
    about: The size of W O is read "h times d v", not "h d v"
    must_not_contain: '\bh d v\b'

  - id: ATT-30
    bug: B13
    about: >
      Table 2's description gives the base model's own BLEU (27.3 EN-DE, 38.1 EN-FR); the prose claims the base
      model beats every earlier model and only the table holds the number. Revisit if Q06 decides short table
      summaries may drop it.
    must_contain: ['27\.3', '38\.1']

  - id: ATT-31
    bug: B11
    about: >
      No overclaims: self-attention ties convolution and restricted self-attention at O(1) sequential operations,
      so it is not "the most efficient"; 8 layers (25.5) is below the base model's 25.8, so it does not "improve"
    must_not_contain:
      - '(?i)self-attention[^.\n]{0,100}\bmost efficient\b'
      - '(?i)\b8\b[^.\n]{0,20}\bimprov\w*[^.\n]{0,20}\b25\.5\b'

  - id: ATT-32
    bug: B02
    about: >
      Equation 3: the learning rate falls with d model (d model to the power of negative 0.5); no equation
      description invents a "schematic". From Can's 3 Oct Mistral runs; the reviewer has not seen those
      passages, so both patterns are guesses at their wording.
    must_not_contain:
      - '(?i)\b(learning rate|it)\s+(rises|increases|grows|goes up)\s+with\s+(the\s+)?(model (dimension|size)|d model)'
      - '(?i)\bequations?\b[^.\n]{0,80}\bschematic\b|\bschematic\b[^.\n]{0,80}\bequations?\b'

  - id: ATT-33
    bug: B15
    about: >
      Heuristic for the order of operations (the manual check below still applies): the positional encoding
      is not one run-on "divided by … raised to … divided by", and Equation 3 does not raise "the product of
      step number and warmup steps" to a power
    must_not_contain:
      - '(?i)divided by [^.,;\n]{1,30} raised to the power of [^.,;\n]{1,30} divided by'
      - '(?i)product of [^.,;\n]{1,40} and [^.,;\n]{1,40} raised to the power'

  - id: ATT-34
    bug: B31
    about: >
      Gomez's affiliation note (the † footnote) is read once. A second one means a running summary
      replaced another footnote with it (R9-01, R9-02)
    must_not_contain: '(?si)(?:Gomez(?:[^.\n]|(?<=\b[A-Z])\.){0,60}\bwork\w*\b(?:[^.\n]|(?<=\b[A-Z])\.){0,40}Google Brain|\bwork\w*\b(?:[^.\n]|(?<=\b[A-Z])\.){0,40}Gomez(?:[^.\n]|(?<=\b[A-Z])\.){0,40}Google Brain).*(?:Gomez(?:[^.\n]|(?<=\b[A-Z])\.){0,60}\bwork\w*\b(?:[^.\n]|(?<=\b[A-Z])\.){0,40}Google Brain|\bwork\w*\b(?:[^.\n]|(?<=\b[A-Z])\.){0,40}Gomez(?:[^.\n]|(?<=\b[A-Z])\.){0,40}Google Brain)'

  - id: ATT-35
    bug: B13
    about: >
      §3.2.2's sentence giving the sizes of the projection matrices (W Q, W K, W V and W O) is read.
      Dropped in every run from f8e8495 until 94c8f63 asked again (R10-02); ATT-29 passed only because
      the sentence was gone
    must_contain: '(?i)\bd model (?:by|times|multiplied by|-by-) ?d k\b'

manual:
  - bug: B15
    check: Equations 1, 2 and 3, multi-head attention and the positional encoding are spoken as ordered steps, innermost first (ATT-33 is only a heuristic).
  - bug: B01
    check: Word highlight stays in step with speech near the start, near the end, and after seeking.
