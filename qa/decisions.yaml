# Settled choices. Do not reopen one in a finding; add a new decision with `supersedes`.
decisions:
  - id: D01
    date: 2026-09-30
    by: [umit, can]
    decision: Tables are shown as printed images with their captions. No cell-by-cell rebuild; the merged-cell and empty-cell rules are dropped.
    why: Rebuilding merged-cell tables from a PDF is unreliable; a printed table cannot be wrong.

  - id: D02
    date: 2026-09-30
    by: [umit, can]
    decision: Roadmap sentences ("In the following sections, we will…") are dropped.
    why: Sections announce themselves as they start; Chollet's paper was full of these.

  - id: D03
    date: 2026-09-30
    by: [umit, can]
    decision: Number style ("512" vs "five hundred twelve") and capitalization inside descriptions are not normalized.
    why: The narration engine reads both forms the same; listeners cannot hear the difference.

  - id: D04
    date: 2026-09-30
    by: [umit, can]
    decision: Pair author names with affiliations only when the counts match; otherwise keep them together.
    why: A wrong affiliation is worse than a lumped one.

  - id: D05
    date: 2026-09-30
    by: [umit, can]
    decision: Figure descriptions describe only what is visible and never guess values. Image-derived claims are not flagged wholesale.
    why: Describing the image is the point of a description; flagging every such claim flags nearly all of them.

  - id: D06
    date: 2026-09-30
    by: [umit, can]
    decision: The contribution note follows the author list; no separate footnote category.

  - id: D07
    date: 2026-09-30
    by: [umit, can, claude, chatgpt]
    decision: When the source is inconsistent, Hilde keeps both values as printed (e.g. Attention 41.0 vs 41.8 BLEU).

  - id: D08
    date: 2026-09-30
    by: [can]
    decision: Equation tripwire (a second model rebuilds each equation from its description, then diff) is deferred.
    why: It doubles the model requests per equation and needs its own way of reporting mismatches.

  - id: D09
    date: 2026-09-30
    by: [can]
    decision: Expand only acronyms the author spells out, once. Each request lists the acronyms already defined.

  - id: D10
    date: 2026-09-30
    by: [can]
    decision: A table image is labeled with its caption, not its spoken description.
    why: The description already sits next to the image as text; using it as the label reads it twice.

  - id: D11
    date: 2026-10-01
    by: [umit]
    decision: Eir's voice is locked. Bragi and Mimir are approved. See voices.yaml.

  - id: D12
    date: 2026-10-01
    by: [can]
    decision: >
      A book's text is written once, from its PDF, and kept in the book's narration.json.
      A new voice reads that text as it is, with no model. Only an explicit "Recreate with
      the latest Hilde" writes it again. Pinning descriptions is not a user feature; golden
      checks run only in qa/qa.py.
    why: >
      Same PDF, same audiobook, every time, without approve or pin controls that make the
      app feel like an experiment. Drafted by the fixer from the reviewer's handoff.

  - id: D13
    date: 2026-10-01
    by: [can]
    decision: >
      Headings keep the paper's own numbers and appendix letters, as printed ("4 Why
      Self-Attention", "B. Baseline Methods"). A numbered heading is read as printed, in
      code, without the model; nothing adds "Part" or "Section". Speaking headings without
      their numbers was a misunderstanding.
    why: The paper's numbers tell a listener where they are; one rule in code cannot vary between requests (B17).

  - id: D14
    date: 2026-10-08
    by: [umit]
    decision: >
      A narration a check finds stating what its source does not (a number or name the source never
      prints, "orders of magnitude" the source never states, or a dropped or added "not", "no", "all" or
      "only"), saying math in an order that can be heard two ways, or leaving out a number its caption prints
      (added 2026-10-08 at the reviewers' suggestion, R22 F75), is asked about once more, naming what
      the check found. The answer with fewer such findings is kept; what remains is marked on the
      passage (narration.json "flags") and shown in the Original view. Other checks only log.
    why: >
      Logging alone shipped errors the checks had found (O2, L-c in the 7 October report). One more
      request costs little; failing the batch would stop a whole book for one sentence.

  - id: D15
    date: 2026-10-08
    by: [umit]
    decision: >
      Answers Q06. A table's description names every row or model the author's text discusses, with its
      key values, and summarizes the rest; each comparison names its metric and which direction is better.
      Tables are still shown as printed (D01), and are never read cell by cell.
    why: Someone listening without a screen should hear the values the paper's argument rests on (R21-09).

  - id: D16
    date: 2026-10-08
    by: [umit]
    decision: >
      Answers Q07. A prompt a paper prints (instructions written for a model) is read word for word. A command
      is read with its exact name and the exact names of its options and arguments, as words without dashes or
      brackets. Program code and algorithms are still described in plain language, not read.
    why: >
      A listener who hears the wrong command name gets the method wrong: DeLM's note command was read as
      "reserve" (R22-05). The reviewer recommended this split.

  - id: D17
    date: 2026-10-09
    by: [umit]
    decision: >
      In the fact-set gate, a fact regresses when it was right in every baseline run and is right in at most a third
      of the new runs (1 of 3). A fact missed in fewer runs is listed as wavering, not counted. Each regression is
      confirmed by rerunning its paper before a change is accepted or rejected.
    why: >
      With 3 runs, a fact right 90% of the time fails "3 of 3" in about 27% of samples, so the strict rule counted
      single-run misses as regressions (13 on 8 October, 5 by this rule). The reviewer proposed it.
