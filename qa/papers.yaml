# Source papers used in QA. `id` is the slug used in runs, findings and golden files.
# sha256: hashes (full, or at least the 12-character folder prefix) of the exact PDFs known to be this paper.
# `qa.py check <book folder>` uses them to pick the golden file.
papers:
  - id: attention
    title: Attention Is All You Need
    url: https://arxiv.org/pdf/1706.03762
    version: v7
    sha256:
      - bdfaa68d8984f0dc02beaca527b76f207d99b666d31d1da728ee0728182df697   # Attention.pdf (same bytes as "…New.pdf")
    quirks:
      - English-to-French BLEU is 41.8 in the abstract and Table 2 but 41.0 in Section 6.1. Keep both (D07).
      - Footnotes 4 and 5 are scientific; the contribution and affiliation notes (∗ † ‡) are author notes.

  - id: chollet
    title: null   # which Chollet paper was used is not recorded; see Q04
    url: null
    quirks:
      - Many footnotes and dense formulas; used as the second test paper for 23dd760.

  - id: procedural-graphs
    title: null   # see Q04
    url: https://arxiv.org/pdf/2609.09153v1
    sha256:
      - 90ffc33b32c009846a183edab09b521cde4d5342ccbfafa71cd00bd2186ddb9a   # R3
    quirks:
      - Figure 5 round labels disagree with the text. Not Hilde's bug (keep).

  - id: bert
    title: "BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding"
    url: https://arxiv.org/pdf/1810.04805
    sha256:
      - 5692a5514787a8c6727b4ff3b726a3385798bc68e12138d1d4af83947e2acf6e   # R4; the migrated book's book.json
    quirks:
      - Section on model size says "all four datasets" for Table 6, which has three tasks. Keep.
      - Two-column layout; footnotes in columns.

  - id: rrsi
    title: "RRSI: Regularized Recursive Self-Improvement of Agent Harnesses"
    url: https://regularized-rsi.com/assets/RRSI.pdf
    sha256:
      - 2dd8e5b5c62bbb5a125a75537ded2f0daae9a3e43d5d414d65ee9b9fb9e18574   # R5
    quirks:
      - Google template: captions are written "Table 1 |" and "Figure 3 |".
      - Abstract says 30% fewer policy tokens; 2.42 vs 3.80 million is about 36%. Keep.
      - Abstract has a stray comma in "the pruner, removes". Keep.
      - Section 4.3 says "the L1-style budget", contradicting its own L0/L1/L2 scheme. Keep.
      - Appendix A.5 says each judge issues 204 comparisons for 185 tasks. Keep.

  - id: clm
    title: Context Language Models
    url: https://arxiv.org/pdf/2609.37725
    sha256:
      - ac5c926814434d8ad2f499183cd2a81e53b4c14f327587f99980ade9157db01b   # R6
    quirks:
      - Figure 5 and Table 1 share a page.
      - The acknowledgments name contains the ligature character U+0133 in the PDF text layer.

  - id: harness-zero
    title: "Harness-Zero: Harness Distillation via Agent-as-Harness"
    url: https://arxiv.org/pdf/2609.24974v1
    version: v1
    sha256:
      - bf0331faa974d446aa360d7ac8bf9bb0cb44363a4fcebc06aea52c6cfcc8101f   # R8; the book's book.json
    quirks:
      - Table 1's "Relative improvement" row (+22.5%, +27.6%) is the mean of six per-setting relative gains, not the gain between the two averages (9.5 / 68.6 = 13.8%). Both are the paper's; keep each with what it measures.
      - Appendix F writes differences in points with "%" ("+1.0% on GPT-5.6 Sol", "-12.0% on Qwen3.6-35B-A3B"). Keep as printed (D07).
      - Listings (Skill 1, Prompt 1, Codes 1 to 3) are monospace boxes with hard-wrapped lines, Skill 1 over three pages and Code 3 under Table 7.
      - Five authors, four affiliations with superscript numbers; the printed order is Peking University (State Key Lab), Peking University (College of Future Technology), Google, HKUST.
      - Observations are labeled with circled digits ("Obs.❶").

