# Fact set for "Procedural Graphs: Self-Evolving Execution Structures for LLM Agents" (arXiv 2609.09153v1).
# Format: facts/README.md. Values checked against Tables 1, 2, 3, 7, 8 and the text of §5 and Appendices C to E.
# Not covered yet: Tables 9 to 11 and Figure 4 are images in the PDF; their numbers need the figure itself.
# Source quirk, not a fact: Figure 5's round labels disagree with Appendix E.3 (R3-06). Either reading is right.
paper: procedural-graphs
source: https://arxiv.org/pdf/2609.09153v1
runs:
  2026-10-01: R3
  2026-10-08: 1 h 57 min; Hilde commit not recorded yet

