# Fact set for "RRSI: Regularized Recursive Self-Improvement of Agent Harnesses". Format: facts/README.md.
# Values checked against https://regularized-rsi.com/assets/RRSI.pdf (figures, tables, appendices).
# Source quirk, not a fact: Figure 2 itself labels complexity-aware acceptance "L1-style" and structural pruning
# "L0-style", while §3.1 calls them L2 (Ridge) and L1 (Lasso). A description may follow either; neither is wrong.
paper: rrsi
source: https://regularized-rsi.com/assets/RRSI.pdf
runs:
  2026-10-01: R5
  2026-10-08: 1 h 15 min; Hilde commit not recorded yet

visuals:

  # ------------------------------------------------ Figure 1
  - name: Figure 1
    find: 'overfits on the split it is scored on'
    holders:
      H0: '\bH ?(0|zero)\b|initial harness'
      prior: 'prior methods|four baseline|average of the'
      RRSI: '\bRRSI\b'
    regions:
      b: '(?i)panel b'
      c: '(?i)panel c'
      d: '(?i)panel d'
    facts:
      - {id: RRSI-F01, what: 'Panel b, SWE-bench Verified: H0', value: '82\.0', holder: H0, region: b, severity: important, source: Fig. 1b, verified: pdf, seen: {2026-10-08: right}}
      - {id: RRSI-F02, what: 'Panel b: average of the four baselines', value: '82\.3', holder: prior, region: b, severity: important, source: Fig. 1b, verified: pdf, seen: {2026-10-08: right}}
      - {id: RRSI-F03, what: 'Panel b: RRSI', value: '83\.8', holder: RRSI, region: b, severity: important, source: Fig. 1b, verified: pdf, seen: {2026-10-08: right}}
      - {id: RRSI-F04, what: 'Panel c, mean of JobBench, GDPval, APEX-Agents: H0', value: '39\.7', holder: H0, region: c, severity: important, source: Fig. 1c, verified: pdf, seen: {2026-10-08: right}}
      - {id: RRSI-F05, what: 'Panel c: average of the four baselines', value: '39\.4', holder: prior, region: c, severity: important, source: Fig. 1c, verified: pdf, seen: {2026-10-08: right}}
      - {id: RRSI-F06, what: 'Panel c: RRSI', value: '43\.6', holder: RRSI, region: c, severity: critical, source: Fig. 1c, verified: pdf, seen: {2026-10-08: right}}
      - {id: RRSI-F07, what: 'Panel d, Frontier-Eng: H0', value: '17\.7', holder: H0, region: d, severity: important, source: Fig. 1d, verified: pdf, seen: {2026-10-08: right}}
      - {id: RRSI-F08, what: 'Panel d: average of the four baselines', value: '17\.9', holder: prior, region: d, severity: important, source: Fig. 1d, verified: pdf, seen: {2026-10-08: right}}
      - {id: RRSI-F09, what: 'Panel d: RRSI', value: '22\.0', holder: RRSI, region: d, severity: critical, source: Fig. 1d, verified: pdf, seen: {2026-10-08: right}}

