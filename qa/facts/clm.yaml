# Fact set for "Context Language Models" (arXiv 2609.37725v1). Format: facts/README.md.
# Every fact was checked against the paper's text; "verified" says how. Values only, never wording:
# a fact is right when its value sits with the right method, symbol or unit, in any phrasing.
paper: clm
source: https://arxiv.org/pdf/2609.37725
runs:
  2026-10-01: R6 (Astra and Claude reviews)
  2026-10-07: R17, 2 h 8 min, 6b4102b
  2026-10-08: 1 h 54 min, 84e7f88 or later (table cells keep manage_context)

visuals:

  # ---------------------------------------------------------------- Figure 1
  - name: Figure 1
    caption: 'work out of the box and can be further improved'
    holders:
      CLM: '\bCLMs?\b'
      Summary: '\bSummary\b'
    facts:
      - id: CLM-F01
        what: Software World held-out speedup, CLM swarm (panel b)
        value: '1\.044'
        holder: CLM
        severity: critical
        source: Fig. 1b; Fig. 6b
        verified: pdf
        seen: {2026-10-08: right}
      - id: CLM-F02
        what: Software World held-out speedup, Summary swarm (panel b)
        value: '1\.026'
        holder: Summary
        severity: critical
        source: Fig. 1b; Fig. 6b
        verified: pdf
        seen: {2026-10-08: right}
      - id: CLM-F03
        what: GPT-5.6-Sol is the model both swarms run on, not a contender with its own result
        not: ['(?i)GPT-5\.6[- ]Sol (at|with|reach\w*|scor\w*)[^.;]{0,15}\d', '(?i)baselines?[^.;]{0,60}GPT-5\.6', '(?i)GPT-5\.6[- ]Sol[^.;]{0,30}baseline']
        severity: important
        source: App. E, Software World
        verified: pdf
        seen: {2026-10-01: wrong, 2026-10-07: wrong, 2026-10-08: wrong}
      - id: CLM-F04
        what: 16.0K, 23.6K and 30.9K in the steering panel are first-compaction context sizes, not accuracy
        says: ['(?i)(compaction|context (size|length))[^.;]{0,80}(16\.0|30\.9) ?K', '(?i)(16\.0|30\.9) ?K[^.;]{0,40}(tokens|context|compaction)']
        not: ['(?i)accuracy[^.;]{0,50}(16\.0|23\.6|30\.9) ?K', '(?i)30\.9 ?(percent|%)']
        severity: critical
        source: Fig. 1c; Fig. 7
        verified: pdf
        seen: {2026-10-01: right, 2026-10-07: wrong, 2026-10-08: wrong}
      - id: CLM-F05
        what: A_eff in panel d is the efficiency advantage
        says: ['(?i)efficiency advantage']
        not: ['(?i)effective (area|attention)']
        severity: important
        source: §4.2, Eq. 6
        verified: pdf
        seen: {2026-10-08: right}
      - id: CLM-F06
        what: w_eff in panel d is the efficiency weight
        says: ['(?i)(weight of the efficiency advantage|efficiency weight)']
        not: ['(?i)task weight']
        severity: important
        source: §4.2
        verified: pdf
        seen: {2026-10-07: wrong, 2026-10-08: right}
      - id: CLM-F07
        what: RL raises Qwen3.5-9B CLM accuracy from 28.8% to 42.5% (panel d)
        says: ['28\.8[^.;]{0,40}42\.5']
        severity: important
        source: Table 2
        verified: pdf
        seen: {2026-10-08: right}
      - id: CLM-F08
        what: RL lowers CLM PFLOPs per question from 1.52 to 1.34 (panel d)
        says: ['1\.52[^.;]{0,40}1\.34']
        severity: important
        source: Table 2
        verified: pdf
        seen: {2026-10-08: right}
      - id: CLM-F09
        what: The textual-evolution panel has no RL
        not: ['(?i)evolv[^.]{0,100}(after|with) RL']
        severity: important
        source: Fig. 1c; Fig. 8
        verified: pdf
        seen: {2026-10-07: wrong, 2026-10-08: right}

  # ---------------------------------------------------------------- Figure 2
  - name: Figure 2
    caption: 'performance comparison of CLM against baselines'
    facts:
      - id: CLM-F10
        what: CLM is not perfect at every pressure level; its KV Store and Log Triage curves dip
        not: ['(?i)(constant|consistent|perfect)[^.;]{0,20}accuracy[^.;]{0,30}(1\.0|one point zero)', '(?i)(1\.0|one point zero)[^.;]{0,40}(regardless|every|all (pressure|four))', '(?i)(across|on) all (four )?tasks[^.;]{0,60}(1\.0|one point zero|perfect)']
        severity: critical
        source: Fig. 2
        verified: figure (R6-02)
        seen: {2026-10-01: wrong, 2026-10-07: wrong, 2026-10-08: wrong}

  # ---------------------------------------------------------------- Equations
  - name: Equation 1
    facts:
      - id: CLM-F11
        what: A standard LM appends (concatenates) its output to the context; no Recursive Language Model
        says: ['(?i)(append|concatenat|combined with)']
        not: ['(?i)Recursive Language Model', '(?i)context-management operation']
        severity: critical
        source: §4.1, Eq. 1
        verified: pdf
        seen: {2026-10-01: wrong, 2026-10-07: wrong, 2026-10-08: right}

  - name: Equation 2
    facts:
      - id: CLM-F12
        what: The next context is the CLM function applied to the current one; a formula, not a diagram
        says: ['(?i)CLM function[^.;]{0,60}(applied|of)']
        not: ['(?i)diagram', '(?i)Recursive Language Model', '(?i)\bloop\b']
        severity: critical
        source: §4.1, Eq. 2
        verified: pdf
        seen: {2026-10-07: wrong, 2026-10-08: wrong}

  - name: Equation 3
    facts:
      - id: CLM-F13
        what: Prefix-reuse FLOPs = prefill of the unmatched suffix + decode of the generated tokens
        says: ['(?i)prefill[^.]{0,200}decode']
        severity: important
        source: §4.1, Eq. 3
        verified: pdf
        seen: {2026-10-08: right}

  - name: Equation 4
    facts:
      - id: CLM-F14
        what: Equation 4 is the CLM transition steered by s; no Recursive Language Model, no suffix cache
        says: ['(?i)CLM function']
        not: ['(?i)Recursive Language Model', '(?i)suffix cache', '(?i)diagram']
        severity: critical
        source: §4.2, Eq. 4
        verified: pdf
        seen: {2026-10-07: wrong, 2026-10-08: wrong}
      - id: CLM-F15
        what: s is an in-context instruction or skill document
        says: ['(?i)(instruction|skill)']
        not: ['(?i)\bseed\b', '(?i)system prompt']
        severity: critical
        source: §4.2
        verified: pdf
        seen: {2026-10-01: missing, 2026-10-07: wrong, 2026-10-08: wrong}

  - name: Equation 5
    facts:
      - id: CLM-F16
        what: s* maximizes the expected trajectory reward over x drawn from D
        says: ['(?i)maximi[sz]es?[^.;]{0,20}expected reward']
        severity: important
        source: §4.2, Eq. 5
        verified: pdf
        seen: {2026-10-08: right}

  - name: Equation 6
    facts:
      - id: CLM-F17
        what: A_eff is the efficiency advantage
        says: ['(?i)efficiency advantage']
        not: ['(?i)effective (area|attention|advantage)']
        severity: critical
        source: §4.2, Eq. 6
        verified: pdf
        seen: {2026-10-01: right, 2026-10-07: wrong, 2026-10-08: wrong}
      - id: CLM-F18
        what: For a successful trajectory, A_eff = clip((c̄ − c_i) / c̄, −1, 1); otherwise 0
        says: ['(?i)(c bar g minus c i|subtract\w* c i from c bar g)[^.]{0,80}divid\w*[^.]{0,30}c bar g']
        severity: important
        source: §4.2, Eq. 6
        verified: pdf
        seen: {2026-10-08: right}

  - name: Equation 7
    facts:
      - id: CLM-F19
        what: The MLP term of C_token is 6·L·d·d_ff
        says: ['(?i)\b6 (multiplied by|times) L,? d,? and d ff']
        severity: important
        source: App. C, Eq. 7
        verified: pdf
        seen: {2026-10-08: right}

  - name: Equation 8
    facts:
      - id: CLM-F20
        what: C_attn = 4·L_attn·h_q·d_h
        says: ['(?i)\b4 (multiplied by|times) L attn,? h q,? and d h']
        severity: important
        source: App. C, Eq. 8
        verified: pdf
        seen: {2026-10-08: right}

  - name: Equation 9
    facts:
      - id: CLM-F21
        what: The prefill attention term uses P_t² − R_t² (prompt and reused lengths)
        says: ['(?i)P t squared (and|minus) R t squared']
        not: ['(?i)prefilled and reused lengths', '(?i)sum of updated and generated']
        severity: important
        source: App. C, Eq. 9
        verified: pdf
        seen: {2026-10-01: wrong, 2026-10-08: right}

