      - {id: DELM-F76, what: 'DeLM finishes 5.5x faster', says: ['5\.5 ?(?:times|x\b|×)'], severity: important, source: '§1; Fig. 3', verified: body, seen: {2026-10-08: right}}
      - {id: DELM-F77, what: 'DeLM agents spend 2% of their time waiting', says: ['(?<![\d.])2 ?(?:%|percent)'], severity: minor, source: '§1; Fig. 3', verified: body, seen: {2026-10-08: right}}
      - {id: DELM-F78, what: 'Totals: Claude Code with subagents 162.7 min, DeLM 29.3 min', says: ['162\.7[\s\S]{0,300}?29\.3'], severity: minor, source: Fig. 3, verified: computed, seen: {2026-10-08: right}}

