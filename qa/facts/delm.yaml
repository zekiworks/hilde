# Fact set for "Decentralized Multi-Agent Systems with Shared Context" (DeLM; arXiv 2606.10662).
# Format: facts/README.md. Names follow the book (Tables 1 to 9).
# verified: arxiv-v2 = checked against arXiv v2's tables (HTML, 1 October 2026), and the body agrees;
#           computed = arithmetic on those values;
#           body     = only the paper's body as the book reads it; recheck with Hilde's PDF.
# Hilde's PDF may be newer than v2, or v2's HTML may differ from its PDF. v2's HTML has no Table 4
# (DeepSeek-V4.1-Flash), so v2's Tables 4 to 7 are the book's Tables 5 to 8. It also gives DeLM n = 2
# with Claude Opus 5.5 on DeepSWE $11.89 per task, where the book says $12.15 (DELM-F31, DELM-F32).
# Score with the book folder (narration.json). In the follow-along text, a figure's `find` block runs
# into the prose after it (the reader prints no figure captions), and Tables 3 and 5 continue after
# their captions, so DELM-F46, F47, F81 and F84 score differently there.
paper: delm
source: https://arxiv.org/abs/2606.10662v2
runs:
  2026-10-08: 1 h 31 min (R22); started before d9f4e2e; commit in the book's book.json

visuals:

  # ------------------------------------------------ Figure 1
  - name: Figure 1
    find: '(?i)faster and more accurate than existing'
    facts:
      - {id: DELM-F71, what: 'Terminal-Bench 4.0: DeLM n = 2 is 1.78x faster than Codex or Claude Code, averaged over two models', says: ['(?<![\d.])1\.78(?!\d)|(?<![\d.])1\.8(?!\d)'], severity: important, source: 'Fig. 1 caption; Table 2 (1.54, 2.02)', verified: computed, seen: {2026-10-08: right}}
      - {id: DELM-F72, what: 'Terminal-Bench 4.0: DeLM n = 2 is 12.5 points more accurate, averaged', says: ['12\.5'], severity: important, source: 'Fig. 1 caption; Table 2 (13.33, 11.66)', verified: computed, seen: {2026-10-08: right}}
      - {id: DELM-F73, what: 'DeepSWE v1.1: DeLM n = 2 is 1.38x faster, averaged', says: ['(?<![\d.])1\.38(?!\d)|(?<![\d.])1\.4(?!\d)'], severity: important, source: 'Fig. 1 caption; Table 3 (1.25, 1.50)', verified: computed, seen: {2026-10-08: right}}
      - {id: DELM-F74, what: 'DeepSWE v1.1: DeLM n = 2 is 13.3 points more accurate, averaged', says: ['13\.3'], severity: important, source: 'Fig. 1 caption; Table 3 (10.00, 16.66)', verified: computed, seen: {2026-10-08: right}}

